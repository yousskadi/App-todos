name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jeton en lecture seule par défaut ; chaque job élève ses permissions au besoin
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todos
          POSTGRES_PASSWORD: todos-ci
          POSTGRES_DB: todos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todos -d todos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://todos:todos-ci@localhost:5432/todos_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # inclut le typecheck (tsc -b) avant le bundle
      - run: npm run build

  # Scan de secrets sur tout l'historique git
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # commentaire sur la PR si une fuite est détectée
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Audit des dépendances (CVE connues) backend et frontend
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e . pip-audit
          pip-audit
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todos
          POSTGRES_PASSWORD: todos-ci
          POSTGRES_DB: todos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todos -d todos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Le webServer Playwright lance .venv/bin/uvicorn et lit ../.env
      # (mêmes chemins qu'en local, voir frontend/playwright.config.ts)
      - name: Préparer le backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
          cat > ../.env <<'EOF'
          POSTGRES_USER=todos
          POSTGRES_PASSWORD=todos-ci
          POSTGRES_DB=todos
          JWT_SECRET=secret-ci-uniquement-jamais-en-production
          EOF
          DATABASE_URL=postgresql+asyncpg://todos:todos-ci@localhost:5432/todos \
          JWT_SECRET=secret-ci-uniquement-jamais-en-production \
            .venv/bin/alembic upgrade head

      - name: Préparer le frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tests e2e
        working-directory: frontend
        run: npx playwright test

      # En-têtes de sécurité du frontend (#54). Ils ne vivent que dans la conf
      # nginx : le serveur de dev Vite ne les sert pas, et sert au contraire des
      # scripts inline qu'une CSP de production refuserait. Il faut donc
      # l'image, et un vrai backend derrière son proxy /api — d'où ce job
      # plutôt qu'un nouveau (un check requis de plus gèlerait les PR ouvertes).
      - name: Démarrer l'image frontend
        run: |
          docker build -t app-todos-frontend:e2e frontend
          docker run -d --name frontend-nginx --network host \
            --user 10001:10001 --cap-drop ALL --read-only \
            --tmpfs /etc/nginx/conf.d:uid=10001 \
            --tmpfs /var/cache/nginx:uid=10001 \
            --tmpfs /var/run:uid=10001 \
            -e BACKEND_URL=http://127.0.0.1:8000 \
            app-todos-frontend:e2e

      - name: Tests des en-têtes de sécurité, contre l'image
        working-directory: frontend
        run: npx playwright test --config=playwright.nginx.config.ts

      - name: Journaux nginx
        if: always()
        run: docker logs frontend-nginx

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  image:
    # Construit et scanne l'image sur chaque PR ; la publie sur GHCR seulement
    # sur main, une fois les tests verts et le scan Trivy passé
    needs: [backend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Construire l'image (locale, pour scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          load: true
          tags: app-todos-backend:ci-scan
      - name: Scan Trivy (bloquant sur CRITICAL/HIGH corrigeables)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-todos-backend:ci-scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/yousskadi/app-todos-backend
          # Tag immuable par SHA de commit, pas de latest flottant (épinglage GitOps)
          tags: type=sha,prefix=sha-,format=short
      - if: github.event_name == 'push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  image-frontend:
    # Même contrat que `image` mais pour le frontend (homelab #69). Job séparé
    # et non matrice : `image` est un check requis par la protection de `main`,
    # une matrice le renommerait en `image (backend)` et la protection
    # attendrait indéfiniment un check qui n'existe plus.
    needs: [frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Construire l'image (locale, pour scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          load: true
          tags: app-todos-frontend:ci-scan
      - name: Scan Trivy (bloquant sur CRITICAL/HIGH corrigeables)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-todos-frontend:ci-scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Vérifier que nginx démarre en non-root, sans upstream joignable
        # Deux régressions attrapées ici, qu'un `docker build` laisse passer :
        # - nginx résout ses upstreams au chargement de la conf, un nom en dur
        #   le fait sortir en [emerg] et le pod boucle (la Gateway route /api
        #   avant ce pod, donc rien ne répond à BACKEND_URL) ;
        # - le conteneur doit tourner sans root ni capabilities, comme le
        #   securityContext du homelab l'impose.
        run: |
          docker run -d --name nginx-smoke \
            --user 10001:10001 --cap-drop ALL --read-only \
            --tmpfs /etc/nginx/conf.d:uid=10001 \
            --tmpfs /var/cache/nginx:uid=10001 \
            --tmpfs /var/run:uid=10001 \
            -e BACKEND_URL=http://127.0.0.1:8000 \
            -p 127.0.0.1:8099:8080 app-todos-frontend:ci-scan
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          docker logs nginx-smoke
          test "$code" = "200" || { echo "::error::nginx n'a pas démarré"; exit 1; }
          docker rm -f nginx-smoke

      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/yousskadi/app-todos-frontend
          tags: type=sha,prefix=sha-,format=short
      - if: github.event_name == 'push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
