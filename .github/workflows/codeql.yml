name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Passe hebdomadaire : attrape les nouvelles règles CodeQL même sans commit
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publication des résultats dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python # backend FastAPI
          - language: javascript-typescript # frontend React/Vite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          # Pas de compilation nécessaire (Python interprété, TS analysé à la source)
          build-mode: none
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:${{ matrix.language }}
